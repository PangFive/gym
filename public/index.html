  share: el => openShare(el.dataset.id || null),
  // calories
  mealCam: () => { if (!needKey('cam')) $('#mealCam').click() },
  mealGal: () => { if (!needKey('gal')) $('#mealGal').click() },
  mealText: () => {
    if (needKey('text')) return;
    sheet(`<h2 class="sh">Tulis makanan</h2><p class="scope" style="margin-top:-8px">Sebutkan makanan dan porsinya, AI yang menghitung.</p>
      <textarea id="mealTxt" class="ta" style="min-height:110px;font-family:inherit" placeholder="Contoh: nasi padang rendang + sayur nangka, es teh manis"></textarea>
      <button class="btn pri block" data-a="mealTextGo">${I('sparkles')} Hitung kalori</button>`);
    setTimeout(() => $('#mealTxt')?.focus(), 350);
  },
  mealTextGo: () => { const t = $('#mealTxt').value.trim(); if (!t) return toast('Tulis dulu makanannya', 'err'); analyzeMeal({ text: t.slice(0, 500) }) },
  mealOpen: el => { const m = S.meals.find(x => x.id === el.dataset.id); if (!m) return; ui.meal = JSON.parse(JSON.stringify(m)); ui.meal.img = ''; openMealReview() },
  mealDayAt: el => { ui.mealDay = el.dataset.k; render() },
  mealDay: el => { const d = new Date((ui.mealDay || dayKey(new Date())) + 'T12:00:00'); d.setDate(d.getDate() + +el.dataset.d); const t = dayKey(new Date()), k = dayKey(d); ui.mealDay = k > t ? t : k; render() },
  mPortion: el => { const m = ui.meal; m.portion = clamp(Math.round((m.portion + +el.dataset.d) * 4) / 4, .25, 4); $('#mPortV').textContent = fmtW(m.portion) + '×'; refreshMealTot() },
  mSlot: el => { ui.meal.slot = el.dataset.k; document.querySelectorAll('#mSlots .chip').forEach(c => { const on = c.dataset.k === ui.meal.slot; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on) }) },
  miDel: el => { ui.meal.items.splice(+el.dataset.ix, 1); $('#mItems').innerHTML = mealItemsHtml(); refreshMealTot() },
  mealSave: () => {
    const m = ui.meal; if (!m.items.length) return toast('Tambahkan minimal satu item', 'err');
    const rec = { id: m.id || uid(), date: m.date, slot: m.slot, name: (m.name || '').trim() || 'Makanan', portion: m.portion, conf: m.conf || 0, note: m.note || '', items: m.items };
    S.meals = S.meals.filter(x => x.id !== rec.id); S.meals.push(rec); S.meals.sort((x, y) => y.date.localeCompare(x.date));
    save(); closeSheet(); render(); toast(`${rec.name} · ${r0(mealTotals(rec).kcal)} kkal tersimpan`);
  },
  mealDel: async () => {
    const m = ui.meal; if (!(await ask({ title: 'Hapus makanan ini?', msg: `${m.name} akan dihapus dari catatan.`, ok: 'Hapus' }))) return;
    S.meals = S.meals.filter(x => x.id !== m.id); save(); closeSheet(); render(); toast('Makanan dihapus');
  },
  aiSetup: () => openAiSetup(),
  aiSave: async el => {
    const key = cleanKey($('#aiKey').value), err = $('#aiErr');
    if (key.length < 20) { err.textContent = 'Key terlalu pendek. Salin ulang seluruh key dari AI Studio.'; return }
    busy(el, true); err.textContent = '';
    try {
      if (key !== aiMsFor) await loadAiModels(true);
      const model = $('#aiModel').value || AI_MODEL;
      await gemini([{ text: 'Balas hanya: OK' }], { key, model }, false, 30000);
      localStorage.setItem(AI_KEY, JSON.stringify(key === aiMsFor ? { key, model, models: ui.aiModels, ms: ui.aiMs, rec: ui.aiRec } : { key, model }));
      const then = ui.aiThen; closeSheet(); toast('Gemini terhubung'); render();
      if (then === 'cam') setTimeout(() => $('#mealCam').click(), 250);
      else if (then === 'gal') setTimeout(() => $('#mealGal').click(), 250);
      else if (then === 'text') setTimeout(() => A.mealText(), 300);
    } catch (e) { err.textContent = e.message } finally { if (el.isConnected) busy(el, false) }
  },
  aiPick: el => {
    $('#aiModel').value = el.dataset.m;
    document.querySelectorAll('#aiModels .mopt').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on) });
  },
  aiForget: async () => { if (!(await ask({ title: 'Hapus API key?', msg: 'Fitur foto kalori berhenti sampai key dipasang lagi.', ok: 'Hapus' }))) return; localStorage.removeItem(AI_KEY); closeSheet(); toast('API key dihapus'); render() },
  profile: openProfile,
  pSet: el => {
    const k = el.dataset.k, v = el.dataset.v;
    ui.prof[k] = k === 'pace' ? +v : k === 'auto' ? v === '1' : v;
    if (k !== 'auto') ui.prof.ai = null;   // advice was for the old values
    if (k !== 'pace') el.parentElement.querySelectorAll('[role=radio]').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-checked', on) });
    profRefresh();
  },
  pAsk: askTargetAdvice,
  pUseAi: () => {
    ui.prof.auto = false; ui.prof.kcal = ui.prof.ai.kcal;
    document.querySelectorAll('[data-a=pSet][data-k=auto]').forEach(b => { const on = b.dataset.v === '0'; b.classList.toggle('on', on); b.setAttribute('aria-checked', on) });
    profRefresh(); toast('Target diisi dari saran Gemini. Ketuk Simpan profil.');
  },
  pKcal: el => { ui.prof.kcal = clamp((ui.prof.kcal || 2000) + +el.dataset.d, 1000, 5000); profRefresh() },
  pSave: () => {
    const { o, err } = profDraft();
    if (err) { $('#pfErr').textContent = err; return }
    const st = S.settings, goalChanged = o.goalW !== st.goalW;
    Object.assign(st, { sex: o.sex, birth: o.birth, height: o.height, goalW: o.goalW, act: o.act, pace: o.pace, kcalAuto: !!ui.prof.auto, kcal: ui.prof.kcal || st.kcal });
    if (Math.abs(o.kg - nowWeight()) >= .05) saveWeight(o.kg);
    // a new goal starts a new stretch: progress is measured from today's weight
    if (goalChanged || !st.startW) { st.startW = o.kg; st.startD = dayKey(new Date()) }
    if (!ui.prof.auto) st.kcal = ui.prof.kcal;
    else st.kcal = energy()?.target || st.kcal;
    save(); closeSheet(); render(); toast('Profil disimpan');
  },
  wLog: openWeightLog,
  wD: el => { const i = $('#wIn'), v = parseFloat(i.value.replace(',', '.')) || ui.wkg; i.value = fmt1(clamp(v + +el.dataset.d / 10, 30, 300)) },
  wSave: () => {
    const v = parseFloat($('#wIn').value.replace(',', '.'));
    if (!(v >= 30 && v <= 300)) { $('#wErr').textContent = 'Berat antara 30–300 kg.'; return }
    saveWeight(v); if (S.settings.kcalAuto) S.settings.kcal = energy()?.target || S.settings.kcal;
    save(); closeSheet(); render(); toast('Berat dicatat');
  },
  scan: openScan,
  scanClose: stopScan,
  iconPick: el => openIconPick(el.dataset.id),
  setIcon: el => { const r = findR(ui.iconFor); if (!r) return; if (el.dataset.v === 'auto') delete r.icon; else r.icon = el.dataset.v; refreshIconPick() },
  setColor: el => { const r = findR(ui.iconFor); if (!r) return; if (el.dataset.v === 'auto') delete r.color; else r.color = el.dataset.v; refreshIconPick() },
  shareWeek: el => { ui.share.week = !ui.share.week; el.setAttribute('aria-checked', String(ui.share.week)) },
  shareNative, shareLink, shareFile,
  tutOpen: openTutImport,
  tutImport: el => importTutorials($('#tutTxt').value, el),
  tutExport: exportTutorials,
  tutPublish: async el => {
    if (!(await ask({ title: 'Simpan data bawaan ke Firebase?', msg: `${BUILTIN.length} alat bawaan aplikasi disimpan ke Firebase. Setelah itu data alat dikelola lewat Import dan Export di sini.`, ok: 'Simpan', tone: 'info', icon: 'upload' }))) return;
    busy(el, true);
    try { await saveTutorials(builtinList().map(x => ({ ...x, p: muscleList(x.p), s: muscleList(x.s) }))); toast('Data alat tersimpan di Firebase'); if ($('#adminSec')) $('#adminSec').innerHTML = adminSection() }
    catch (e) { toast('Gagal menyimpan: ' + (e.code || e.message), 'err') }
    finally { if (el.isConnected) busy(el, false) }
  },
  apSug: el => {
    ui.appDraft.suggestion = el.dataset.v; $('#apSug').value = el.dataset.v;
    document.querySelectorAll('#apChips .chip').forEach(c => { const on = c.dataset.v === el.dataset.v; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on) });
    syncAppBar();
  },
  goalD: el => { S.settings.goal = clamp(S.settings.goal + +el.dataset.d, 1, 7); save(); $('#goalV').textContent = S.settings.goal + '×'; if (route().page !== 'workout') render() },
  restD: el => { S.settings.rest = clamp(S.settings.rest + +el.dataset.d, 15, 300); save(); $('#restV').textContent = S.settings.rest + ' dtk' }
};
document.addEventListener('click', e => {
  const dl = e.target.closest('[data-dlg]');
  if (dl) { dlgDone?.(dl.dataset.dlg === '1'); return }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) { e.preventDefault(); f(el) }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.i; if (!k) return;
  if (k === 'q') { ui.q = el.value; $('#libHead').innerHTML = libHead(); $('#libList').innerHTML = libList() }
  else if (k === 'pq') { ui.pick.q = el.value; $('#pkList').innerHTML = pickList() }
  else if (k === 'pkAiQ') ui.pick.aiQ = el.value.slice(0, 200);
  else if (k === 'rname') { const r = curR(); if (r) { r.name = el.value.slice(0, 40); save() } }
  else if (k === 'edReps') { const r = curR(); if (r) { r.items[+el.dataset.ix].reps = el.value.slice(0, 7); save() } }
  else if (k === 'sw' || k === 'sr') { const s = S.active.items[+el.dataset.ex].sets[+el.dataset.ix]; s[k === 'sw' ? 'w' : 'r'] = el.value; save(); updSum() }
  else if (k === 'prof') { ui.prof[el.dataset.k] = el.value; ui.prof.ai = null; $('#pfErr').textContent = ''; profRefresh() }
  else if (k === 'aiKey') { $('#aiErr').textContent = ''; clearTimeout(aiMsT); aiMsT = setTimeout(loadAiModels, 500) }
  else if (k.startsWith('auth')) { el.removeAttribute('aria-invalid'); if (k === 'authEmail') ui.authEmail = el.value; const er = $('#authErr'); if (er) er.textContent = '' }
  else if (k === 'ap') {
    const f = el.dataset.k; ui.appDraft[f] = el.value;
    if (f === 'appName') $('#pvName').textContent = el.value.trim() || 'Wegym';
    if (f === 'announcement') {
      const t = el.value.trim(), c = $('#apCnt');
      $('#pvAnn').textContent = t || 'Belum ada pengumuman. Tulis di bawah untuk menampilkannya di Beranda.';
      $('#pvBan').classList.toggle('empty', !t);
      c.textContent = el.value.length + '/300'; c.classList.toggle('max', el.value.length >= 300);
    }
    if (f === 'suggestion') document.querySelectorAll('#apChips .chip').forEach(c => { const on = c.dataset.v === el.value.trim(); c.classList.toggle('on', on); c.setAttribute('aria-pressed', on) });
    syncAppBar();
  }
  else if (k === 'mName') { if (ui.meal) ui.meal.name = el.value }
  else if (k === 'mi') {
    const it = ui.meal?.items[+el.dataset.ix], f = el.dataset.f; if (!it) return;
    if (f === 'n') it.n = el.value;
    else if (f === 'g') { const g = Math.max(0, parseFloat(el.value.replace(',', '.')) || 0); if (it.g > 0 && g > 0) { const k = g / it.g; it.kcal *= k; it.p *= k; it.c *= k; it.f *= k; const kc = el.parentNode.querySelector('[data-f=kcal]'); if (kc) kc.value = r0(it.kcal) } it.g = g }
    else if (f === 'kcal') { const v = Math.max(0, parseFloat(el.value.replace(',', '.')) || 0); if (it.kcal > 0) { const k = v / it.kcal; it.p *= k; it.c *= k; it.f *= k } it.kcal = v }
    refreshMealTot();
  }
  else if (k === 'setName') { S.settings.name = el.value.trim().slice(0, 20) || 'Kamu'; save() }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  const f = e.target, up = ui.authMode === 'up', email = f.email.value.trim(), pw = f.password.value, name = up ? f.nick.value.trim() : '';
  if (up && !name) return fieldErr(f.nick, 'Isi nama panggilanmu.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return fieldErr(f.email, 'Format email belum benar.');
  if (pw.length < 6) return fieldErr(f.password, 'Password minimal 6 karakter.');
  if (!fb.mod) return fieldErr(null, 'Masih menyiapkan koneksi. Coba lagi sebentar.');
  const btn = f.querySelector('button[type=submit]'); busy(btn, true);
  try {
    if (up) {
      pendingName = name;
      const c = await fb.mod.createUserWithEmailAndPassword(fb.auth, email, pw);
      fb.mod.updateProfile(c.user, { displayName: name }).catch(() => {});
    } else await fb.mod.signInWithEmailAndPassword(fb.auth, email, pw);
  } catch (err) { authFail(err) } finally { busy(btn, false) }
});
document.addEventListener('change', e => {
  if ((e.target.id === 'mealCam' || e.target.id === 'mealGal') && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    return shrinkImage(f).then(dataUrl => analyzeMeal({ dataUrl })).catch(() => toast('Foto tidak bisa dibaca', 'err'));
  }
  if (e.target.id === 'tutFile' && e.target.files[0]) {
    return e.target.files[0].text().then(t => { $('#tutTxt').value = t; importTutorials(t, document.querySelector('[data-a=tutImport]')) });
  }
  if (e.target.id !== 'impFile' || !e.target.files[0]) return;
  e.target.files[0].text().then(importText);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (dlgDone) dlgDone(false); else if (!$('#vmodal').hidden) closeVideo(); else if (!$('#scan').hidden) stopScan(); else if ($('#sheet').classList.contains('open')) closeSheet() }
  // The muscles on the body map are SVG paths, which do not click on Enter/Space by themselves.
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('path[data-a]')) { e.preventDefault(); A.muscle(e.target) }
});
// Drag a sheet down from its top to close it, the way native bottom sheets work.
let drag = null;
document.addEventListener('touchstart', e => {
  const p = e.target.closest('#sheet.open .panel'); if (!p) return;
  const head = !!e.target.closest('.sheet-head'), body = p.querySelector('.sheet-body');
  if (e.target.closest('.sx') || (!head && (body.scrollTop > 0 || e.target.closest('input,textarea,iframe,.chips,.qchips')))) return;
  drag = { p, y: e.touches[0].clientY, dy: 0, on: false };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!drag) return;
  const dy = e.touches[0].clientY - drag.y;
  if (!drag.on) { if (dy < -4) { drag = null; return } if (dy < 10) return; drag.on = true }
  drag.dy = Math.max(0, dy - 10);
  drag.p.style.transition = 'none'; drag.p.style.transform = `translate(-50%,${drag.dy}px)`;
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!drag) return;
  const { p, dy, on } = drag; drag = null;
  if (!on) return;
  p.style.transition = 'transform .22s cubic-bezier(.2,.85,.25,1)';
  if (dy > 110) closeSheet(); else p.style.transform = '';
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); drawRest() } else if (scan.stream) stopScan() });

boot();
</script>
